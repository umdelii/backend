<!DOCTYPE html>
<html lang="en" layout:decorate="~{/layouts/layout}">
  <div layout:fragment="content">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title fw-semibold mb-4">Board Information</h5>
        <div class="card">
          <div class="card-body">
            <form action="" method="post">
              <div class="mb-3">
                <label for="bno" class="form-label">Board Number</label>
                <input
                  type="text"
                  class="form-control"
                  id="bno"
                  aria-describedby="bno"
                  name="bno"
                  th:value="${dto.bno}"
                  readonly
                />
              </div>
              <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input
                  type="text"
                  class="form-control"
                  id="title"
                  name="title"
                  th:value="${dto.title}"
                  readonly
                />
              </div>
              <div class="mb-3">
                <label for="content" class="form-label">Content</label>
                <textarea
                  class="form-control"
                  id="content"
                  name="content"
                  rows="10"
                  th:text="${dto.content}"
                  readonly
                >
                </textarea>
              </div>
              <div class="mb-3">
                <label for="createDateTime" class="form-label"
                  >Create Date</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="createDateTime"
                  name="createDateTime"
                  th:value="${#temporals.format(dto.createDateTime,'yyyy-MM-dd HH:mm')}"
                  readonly
                />
              </div>
              <a
                type="button"
                class="btn btn-success"
                th:href="@{/board/modify(bno=${dto.bno},page=${pageRequestDTO.page},size=${pageRequestDTO.size})}"
                >Update</a
              >
              <a
                type="button"
                class="btn btn-primary"
                th:href="@{/board/list(page=${pageRequestDTO.page},size=${pageRequestDTO.size})}"
                >List</a
              >
              <input
                type="hidden"
                name="page"
                th:value="${pageRequestDTO.page}"
              />
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <th:block layout:fragment="script">
    <script th:inline="javascript">

      let msg = [[${msg}]];

      if (msg) {
          Swal.fire({
              title: msg,
              icon: "success",
              draggable: true
          });
      }
    </script>
  </th:block>
</html>
