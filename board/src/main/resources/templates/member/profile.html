<!DOCTYPE html>
<html
  lang="en"
  layout:decorate="~{/layouts/layout}"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <div layout:fragment="content">
    <h2>Profile</h2>
    <h3>権限確認 : <span sec:authentication="principal.authorities"></span></h3>
    <h3>
      username(ID) : <span sec:authentication="principal.username"></span>
    </h3>
    <br />
    <div sec:authorize="isAuthenticated()">
      こちらはauthenticationされたユーザーが見れる所
    </div>
    <div sec:authorize="hasRole('ROLE_ADMIN')">
      こちらはauthenticationされたユーザー中、「ADMIN」権限持ちの方のみ見れる所
    </div>
    <div sec:authorize="hasRole('ROLE_MANAGER')">
      こちらはauthenticationされたユーザー中、「MANAGER」権限持ちの方のみ見れる所
    </div>
    <div sec:authorize="hasRole('ROLE_USER')">
      こちらはauthenticationされたユーザー中、「USER」権限持ちの方のみ見れる所
    </div>
    <div th:text="${#authentication.name}"></div>
    <div th:text="${#authentication.principal.email}"></div>
    <div th:text="${#authentication.principal.name}"></div>
    <div th:text="${#authentication.principal.fromSocial}"></div>
    <div th:text="${#authentication.principal.authorities}"></div>
  </div>
</html>
