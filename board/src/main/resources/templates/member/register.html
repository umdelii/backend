<!DOCTYPE html>
<html lang="en" layout:decorate="~{/layouts/layout}">
  <div layout:fragment="content">
    <h2>Register</h2>
    <form
      method="post"
      th:action="@{/member/register}"
      th:object="${registerDTO}"
      novalidate
    >
      <!-- novalidate : html 基本有効性検証
     ex. type = "email" -->
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input
          type="email"
          class="form-control"
          id="email"
          name="email"
          aria-describedby="emailHelp"
          placeholder="email"
        />
      </div>
      <div
        class="text-danger"
        th:if="${#fields.hasErrors('email')}"
        th:errors="*{email}"
      ></div>
      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          class="form-control"
          id="password"
          name="password"
          placeholder="passowrd"
        />
      </div>
      <div
        class="text-danger"
        th:if="${#fields.hasErrors('password')}"
        th:errors="*{password}"
      ></div>
      <div class="mb-4">
        <label for="name" class="form-label">Name</label>
        <input
          type="name"
          class="form-control"
          id="name"
          name="name"
          placeholder="name"
        />
      </div>
      <div
        class="text-danger"
        th:if="${#fields.hasErrors('name')}"
        th:errors="*{name}"
      ></div>
      <div th:if="${dupEmail}">
        <div class="alert alert-danger text-center">[[${dupEmail}]]</div>
      </div>
      <button
        type="submit"
        class="btn btn-primary w-100 py-8 fs-4 mb-4 rounded-2"
      >
        会員登録
      </button>
    </form>
  </div>
</html>
