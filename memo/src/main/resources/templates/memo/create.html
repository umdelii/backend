<!DOCTYPE html>
<html lang="en" layout:decorate="~{layouts/main_layout}">
  <div layout:fragment="content">
    <h1>Create</h1>
    <form action="" method="post" id="insert-form" th:object="${dto}">
      <div class="mb-3">
        <label for="memoText" class="form-label">Text</label>
        <textarea class="form-control" id="memoText" rows="3" name="memoText">
[[${dto.memoText}]]</textarea
        >
        <div
          class="text-danger"
          th:if="${#fields.hasErrors('memoText')}"
          th:errors="*{memoText}"
        ></div>
      </div>
      <a type="button" class="btn btn-outline-success" th:href="@{/memo/list}"
        >List</a
      >
      <button type="submit" class="btn btn-outline-primary">Create Memo</button>
    </form>
  </div>
</html>
