<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- securityでは th:actionがあれば　csrfを自動的に生成してくれる -->
    <form th:action="@{/sample/login}" method="post">
      <div>
        <input type="text" name="username" id="username" placeholder="userid" />
      </div>
      <div>
        <input
          type="password"
          name="password"
          id="password"
          placeholder="password"
        />
      </div>
      <div>
        <button type="submit">ログイン</button>
      </div>
    </form>
  </body>
</html>
