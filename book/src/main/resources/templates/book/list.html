<!DOCTYPE html>
<html lang="en" layout:decorate="~{/layouts/layout}">
  <div layout:fragment="content">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title fw-semibold mb-4">Book list</h5>
        <table class="table">
          <thead>
            <tr>
              <th scope="col">Isbn</th>
              <th scope="col">Title</th>
              <th scope="col">Price</th>
              <th scope="col">Author</th>
              <th scope="col">Description</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="dto : ${list}">
              <th scope="row" th:text="${dto.isbn}"></th>
              <td>
                <a
                  th:href="@{/book/read(id=${dto.id})}"
                  th:text="${dto.title}"
                ></a>
              </td>
              <td th:text="${dto.price}"></td>
              <td th:text="${dto.author}"></td>
              <td th:text="${dto.description}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
    <th:block layout:fragment="script">
    <!-- 페이지별 javascript 작성 -->
    <script th:inline="javascript">
      let msg = [[${msg}]];
      console.log(msg);
      if (msg) {
          Swal.fire({
            title: msg,
            icon: "success",
            draggable: true,
          });
      }
    </script>
</html>
