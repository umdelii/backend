spring:
  application:
    name: movietalk

  thymeleaf:
    cache: false

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

    database-platform: org.hibernate.dialect.MySQL8Dialect

  # profiles:
  #   include:
  #     - oauth

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 30MB

logging:
  level:
    org:
      hibernate:
        SQL: debug
        orm:
          jdbc:
            bind: trace
