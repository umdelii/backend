<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h3>업로드 테스트</h3>
    <!-- <form action="" method="post" enctype="multipart/form-data">
      <input type="file" name="upload-file" id="" />
    </form> -->

    <!-- 
        accept="" : 첨부 파일 제한
        multiple : 한 번에 여러 개의 파일 선택 가능
    -->
    <input
      type="file"
      name="upload-files"
      id=""
      multiple
      accept="image/png, image/jpg"
    />
    <button type="button">アップロード</button>
    <div id="output"></div>
    <script>
      const showUploadImages = () => {
        const output = document.querySelector("#output");

        files.forEach((file) => {
          output.insertAdjacentHTML(
            "beforeend",
            `<img src="/upload/display?fileName=${file.imageURL}">`
          );
        });
      };

      document.querySelector("button").addEventListener("click", () => {
        const uploadFiles = document.querySelector("[name='upload-files']");
        const files = uploadFiles.files;
        console.log(files);

        const formData = new FormData();
        for (let idx = 0; idx < files.length; idx++) {
          formData.append("uploadFiles", files[idx]);
        }
        fetch("/upload/upload", {
          method: "post",
          body: formData,
        })
          .then((res) => res.json())
          .then((data) => {
            console.log(data);
          });
      });
    </script>
  </body>
</html>
