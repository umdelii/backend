<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <h3>업로드 테스트</h3>
    <!-- <form action="" method="post" enctype="multipart/form-data">
      <input type="file" name="upload-file" id="" />
    </form> -->

    <!-- 
        accept="" : 첨부 파일 제한
        multiple : 한 번에 여러 개의 파일 선택 가능
    -->
    <input
      type="file"
      name="upload-files"
      id=""
      multiple
      accept="image/png, image/jpg"
    />
    <button type="button">アップロード</button>
    <div id="output"></div>
    <script>
      const showUploadImages = (files) => {
        const output = document.querySelector("#output");

        let tags = "";

        files.forEach((file) => {
          tags += "<div>";
          tags += `<img src="/upload/display?fileName=${file.thumbnailURL}">`;
          tags += `<a href="${file.imageURL}"><i class="fa-solid fa-xmark"></i></a>`;
          tags += "</div>";
          output.insertAdjacentHTML("beforeend", tags);
        });
      };

      document.querySelector("button").addEventListener("click", () => {
        const uploadFiles = document.querySelector("[name='upload-files']");
        const files = uploadFiles.files;
        console.log(files);

        const formData = new FormData();
        for (let idx = 0; idx < files.length; idx++) {
          formData.append("uploadFiles", files[idx]);
        }
        fetch("/upload/upload", {
          method: "post",
          body: formData,
        })
          .then((res) => res.json())
          .then((data) => {
            console.log(data);
            showUploadImages(data);
          });
      });

      // x クリックするとファイル削除
      document.querySelector("#output").addEventListener("click", (e) => {
        e.preventDefault();
        console.log("イベント対象 ", e.target); // <i></i>
        // closest() : 가장 가까운 부모요소
        const aTag = e.target.closest("a");
        const div = e.target.closest("div");
        // href
        console.log("属性値 ", aTag.href);
        console.log("属性値 ", aTag.getAttribute("href"));
        const href = aTag.getAttribute("href");

        // controller
        const formData = new FormData();
        formData.append("fileName", href);
        fetch("/upload/remove", {
          method: "post",
          body: formData,
        })
          .then((res) => res.text())
          .then((data) => {
            console.log(data);
            // 画面上のイメージも消す
            div.remove();
          });
      });
    </script>
  </body>
</html>
